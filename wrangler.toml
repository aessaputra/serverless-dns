name = "serverless-dns"
main = "./dist/worker.js"
workers_dev = false
logpush = false
compatibility_date = "2023-03-21"
send_metrics = false
minify = true
upload_source_maps = true
routes = [
  { pattern = "dns.aes.my.id", custom_domain = true }
]

[build]
command = "npm run build"

[[rules]]
type = "ESModule"
globs = ["**/*.js"]

[vars]
LOG_LEVEL = "info"
WORKER_ENV = "production"
CLOUD_PLATFORM = "cloudflare"
